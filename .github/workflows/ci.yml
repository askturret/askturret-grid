name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (non-blocking)
        run: npm audit --audit-level=high --omit=dev || true
        continue-on-error: true

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build package
        run: npm run build

  test-react-19:
    name: Test React 19
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install React 19
        run: npm install --save-dev react@^19.0.0 react-dom@^19.0.0 @types/react@^19.0.0 @types/react-dom@^19.0.0

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build package
        run: npm run build

  test-browser:
    name: Cross-browser Tests (Firefox)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps firefox

      - name: Run browser tests
        run: npm run test:browser

  build-demo:
    name: Build Demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Install demo dependencies
        working-directory: demo
        run: npm ci

      - name: Build demo
        working-directory: demo
        run: npm run build

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-dist
          path: demo/dist
          retention-days: 7

  test-wasm:
    name: Test WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version/license/repository parity
        run: |
          # Extract root package.json version
          ROOT_VERSION=$(jq -r '.version' package.json)

          # Extract wasm package.json fields
          WASM_PKG_VERSION=$(jq -r '.version' wasm/package.json)
          WASM_PKG_LICENSE=$(jq -r '.license' wasm/package.json)
          WASM_PKG_REPO=$(jq -r '.repository.url' wasm/package.json)

          # Extract wasm Cargo.toml fields (using basic grep/sed since tomlq may not be available)
          WASM_CARGO_VERSION=$(grep '^version = ' wasm/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          WASM_CARGO_LICENSE=$(grep '^license = ' wasm/Cargo.toml | head -1 | sed 's/license = "\(.*\)"/\1/')
          WASM_CARGO_REPO=$(grep '^repository = ' wasm/Cargo.toml | head -1 | sed 's/repository = "\(.*\)"/\1/')

          # Verify versions match
          if [ "$ROOT_VERSION" != "$WASM_PKG_VERSION" ]; then
            echo "❌ Version mismatch: root package.json ($ROOT_VERSION) != wasm/package.json ($WASM_PKG_VERSION)"
            exit 1
          fi
          if [ "$ROOT_VERSION" != "$WASM_CARGO_VERSION" ]; then
            echo "❌ Version mismatch: root package.json ($ROOT_VERSION) != wasm/Cargo.toml ($WASM_CARGO_VERSION)"
            exit 1
          fi

          # Verify licenses are Apache-2.0
          if [ "$WASM_PKG_LICENSE" != "Apache-2.0" ]; then
            echo "❌ License error: wasm/package.json license is $WASM_PKG_LICENSE, expected Apache-2.0"
            exit 1
          fi
          if [ "$WASM_CARGO_LICENSE" != "Apache-2.0" ]; then
            echo "❌ License error: wasm/Cargo.toml license is $WASM_CARGO_LICENSE, expected Apache-2.0"
            exit 1
          fi

          # Verify repositories point to askturret/askturret-grid
          if [[ "$WASM_PKG_REPO" != *"askturret/askturret-grid"* ]]; then
            echo "❌ Repository error: wasm/package.json repository is $WASM_PKG_REPO, expected askturret/askturret-grid"
            exit 1
          fi
          if [[ "$WASM_CARGO_REPO" != *"askturret/askturret-grid"* ]]; then
            echo "❌ Repository error: wasm/Cargo.toml repository is $WASM_CARGO_REPO, expected askturret/askturret-grid"
            exit 1
          fi

          echo "✅ All version/license/repository checks passed"
          echo "   Version: $ROOT_VERSION"
          echo "   License: Apache-2.0"
          echo "   Repository: askturret/askturret-grid"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            wasm/target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('wasm/Cargo.lock', 'wasm/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cargo audit
        uses: rustsec/audit-check@v2.0.0
        with:
          working-directory: wasm
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run cargo test
        working-directory: wasm
        run: cargo test

      - name: Build WASM package
        working-directory: wasm
        run: wasm-pack build --target web --out-dir pkg

  size-limit:
    name: Bundle Size Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Check bundle size
        run: npm run size