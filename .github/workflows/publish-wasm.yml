name: Publish WASM to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not publish)'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: |
          cd wasm
          wasm-pack build --target web --out-dir pkg --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare package
        run: |
          cd wasm
          # Copy package.json fields to pkg/package.json
          node -e "
            const pkg = require('./package.json');
            const wasmPkg = require('./pkg/package.json');
            wasmPkg.name = pkg.name;
            wasmPkg.version = pkg.version;
            wasmPkg.description = pkg.description;
            wasmPkg.license = pkg.license;
            wasmPkg.author = pkg.author;
            wasmPkg.repository = pkg.repository;
            wasmPkg.bugs = pkg.bugs;
            wasmPkg.homepage = pkg.homepage;
            wasmPkg.keywords = pkg.keywords;
            require('fs').writeFileSync('./pkg/package.json', JSON.stringify(wasmPkg, null, 2));
          "

      - name: Publish (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: |
          cd wasm/pkg
          npm publish --dry-run --access public

      - name: Publish to npm
        if: github.event.inputs.dry_run != 'true'
        run: |
          cd wasm/pkg
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm provenance
        if: github.event.inputs.dry_run != 'true'
        run: |
          cd wasm
          PACKAGE_VERSION=$(node -e "console.log(require('./package.json').version)")
          npm audit signatures @askturret/grid-wasm@${PACKAGE_VERSION}

  notify-failure:
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const runId = context.runId;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `@askturret/grid-wasm publish failed: ${tag} (run ${runId})`,
              body: `## Publish Failure\n\n**Package:** @askturret/grid-wasm\n**Tag:** ${tag}\n**Run:** [${runId}](${runUrl})\n\nThe publish workflow failed. Please check the [workflow run](${runUrl}) for details.\n\nReview the failed step logs to diagnose the issue.`,
              labels: ['bug', 'priority:high', 'team:AskTurret.grid']
            });
